name: Deploy Avatar test world

on:
  workflow_dispatch:
  push:
    paths:
      - 'my-virtual-world_v10_cloudflare_online.zip'
      - '.github/workflows/deploy-avatar.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract game project
        run: |
          unzip -o my-virtual-world_v10_cloudflare_online.zip -d extracted
          test -f extracted/world/wrangler.toml
          sed -i 's/^name = "damp-shadow-03ce"/name = "avatar-virtual-world-test"/' extracted/world/wrangler.toml

      - name: Install dependencies
        working-directory: extracted/world
        run: npm install

      - name: Deploy Cloudflare Worker and game assets
        working-directory: extracted/world
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
