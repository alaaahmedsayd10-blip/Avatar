name: Publish Avatar on GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'my-virtual-world_v10_cloudflare_online.zip'
      - '.github/workflows/pages.yml'
      - 'README.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract game
        run: |
          unzip -o my-virtual-world_v10_cloudflare_online.zip -d extracted
          test -f extracted/world/public/index.html
          mkdir -p site
          cp -R extracted/world/public/. site/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
